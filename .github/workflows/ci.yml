name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dash check (no em or en dashes)
        run: npm run lint:dashes

      - name: Type check
        run: npm run typecheck

      - name: Unit & component tests (with coverage)
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  styling-proof:
    name: Styling and device proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Prove every styling option reaches the PDF and DOCX
        run: npm run proof:exports

      - name: Start the app
        run: npm run dev -- -p 3100 &

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/settings; then
              echo "app is up"; exit 0
            fi
            sleep 2
          done
          echo "app never came up"; exit 1

      - name: Prove every styling option reaches the live preview
        run: npm run proof:styling

      - name: Prove every screen works on every device
        run: npm run proof:responsive

      - name: Upload device evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: responsive-proof
          path: docs/responsive-proof/
          retention-days: 7

      - name: Upload styling evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: styling-proof
          path: docs/styling-proof/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t dravvy:ci .
